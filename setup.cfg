[metadata]
name = corpussync
version = attr: corpussync.__init__.__version__
description = Build a searchable corpus from your own notes, documents, transcripts and captions, on your own machine.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
packages = corpussync
python_requires = >=3.9
install_requires =
    qdrant-client>=1.10
    requests>=2.31

[options.extras_require]
pdf = pypdf>=4
docx = python-docx>=1.1
dev = pytest>=8

[options.entry_points]
console_scripts =
    corpussync = corpussync.cli:main
